[project]
name = "devsecops-job-hub"
version = "0.1.0"
description = "Find DevSecOps and cloud security roles at U.S. government contractors."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-recording>=0.13",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devsecops_job_hub" = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # FastAPI uses Query/Depends in argument defaults idiomatically
    "RUF001", # en-dashes are intentional in salary-range regex
    "RUF003", # en-dashes in module docstrings are intentional
    "UP042",  # `class Foo(str, Enum)` is the well-tested pattern; StrEnum migration is style-only
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytest-recording: cassettes are recorded once and replayed on subsequent runs.
# Override on demand with `--record-mode=rewrite` to refresh against the live API.
markers = [
    "vcr: replay HTTP via a checked-in cassette (no live network on CI)",
]
